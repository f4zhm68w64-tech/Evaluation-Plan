<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b6ef3"><title>Evaluation Plan</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"></head><body>
<header id="topbar"><div class="brand">Evaluation Plan <span id="version">v1.0</span></div><nav><button data-view="plans">Evaluaciones</button><button data-view="builder">Builder</button><button data-view="run">Ejecutar</button></nav></header>
<main>
<section id="plans" class="view"><div class="hero"><h1>Evaluaciones</h1><p>Crea bancos de preguntas e inicia prácticas con un subset aleatorio.</p><button class="primary" id="newPlan">+ Nueva evaluación</button></div><div id="planList" class="cards"></div></section>
<section id="builder" class="view hidden"><div class="panel"><div class="row between"><h1>Builder</h1><button id="deletePlan" class="danger ghost">Eliminar</button></div><label>Nombre de la evaluación<input id="planName" placeholder="Ej. Biología — Fotosíntesis"></label><div class="grid2"><label>Preguntas por intento<input id="subsetSize" type="number" min="1" value="10"></label><label>Corrección<select id="feedbackMode"><option value="end">Al final</option><option value="immediate">Inmediata</option></select></label></div><div class="checks"><label><input id="shuffleQuestions" type="checkbox" checked> Mezclar preguntas</label><label><input id="shuffleOptions" type="checkbox" checked> Mezclar respuestas</label></div><hr><h2>Importar preguntas</h2><p class="muted">Pegá preguntas generadas por cualquier IA usando A), B), C)… y <b>CORRECTA:</b>. EXPLICACIÓN y TEMA son opcionales.</p><textarea id="importText" rows="12" placeholder="¿Pregunta?&#10;A) Opción 1&#10;B) Opción 2&#10;C) Opción 3&#10;D) Opción 4&#10;CORRECTA: B&#10;EXPLICACIÓN: ...&#10;TEMA: ..."></textarea><div class="row"><button class="primary" id="parseImport">Analizar e importar</button><span id="importStatus" class="muted"></span></div><hr><div class="row between"><h2>Banco de preguntas <span id="qCount"></span></h2><button id="clearQuestions" class="ghost danger">Vaciar banco</button></div><div id="questionList"></div><div class="sticky-actions"><button class="primary" id="savePlan">Guardar evaluación</button><button id="testPlan">Probar</button></div></div></section>
<section id="run" class="view hidden"><div id="runPicker" class="panel"><h1>Ejecutar</h1><div id="runPlanList" class="cards"></div></div><div id="player" class="panel hidden"></div></section>
<section id="results" class="view hidden"><div id="resultBox" class="panel"></div></section>
</main>
<footer id="footer"><span>Evaluation Plan</span><span>v1.0</span></footer><script src="app.js"></script></body></html>
